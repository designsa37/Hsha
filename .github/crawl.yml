name: Scrape Quotes
run-name: 🕷️ Scraping quotes...

on:
  workflow_dispatch:  # ← Click a button in GitHub to run manually!
  schedule:
    - cron: '0 8 * * *'  # ← Auto-run every day at 8AM UTC

permissions:
  contents: write  # ← Lets it commit the updated quotes.json

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🕷️ Run crawler
        run: python crawler.py

      - name: 💾 Commit & push updated quotes.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "🤖 Updated quotes.json — $(date +'%Y-%m-%d')" || exit 0
          git push
